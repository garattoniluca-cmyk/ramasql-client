querybuilder.designer=Grafico
querybuilder.syntax=SQL
querybuilder.designer.tooltip=La query disegnata: trascina le tabelle dall'elenco nel diagramma e spunta le colonne da mostrare. L'SQL si scrive da solo nella vista SQL.
querybuilder.syntax.tooltip=Il testo SQL della query disegnata, aggiornato a ogni modifica del diagramma.
querybuilder.objects.tooltip=Le tabelle e le viste del catalogo: trascinane una nel diagramma, o fai doppio clic, per usarla nella query.
querybuilder.tree.query.tooltip=La query principale: sotto ci sono le sue clausole, nell'ordine in cui compaiono nell'SQL. Con il tasto destro si aggiungono condizioni ed espressioni.
querybuilder.tree.subquery.tooltip=Una sottoquery: una query dentro la query principale, con le sue clausole.
querybuilder.tree.select.tooltip=SELECT: le colonne e le espressioni che compaiono nel risultato, nell'ordine delle colonne.
querybuilder.tree.from.tooltip=FROM: le tabelle da cui si leggono i dati e i join che le uniscono.
querybuilder.tree.where.tooltip=WHERE: le condizioni che ogni riga deve rispettare per entrare nel risultato.
querybuilder.tree.groupby.tooltip=GROUP BY: le colonne che raggruppano le righe; funzioni come COUNT o SUM si calcolano per ogni gruppo.
querybuilder.tree.having.tooltip=HAVING: le condizioni sui gruppi, controllate dopo il raggruppamento (per esempio COUNT(*) > 2).
querybuilder.tree.orderby.tooltip=ORDER BY: l'ordine delle righe del risultato, crescente (ASC) o decrescente (DESC).
querybuilder.tree.table.tooltip=Una tabella della query: le sue righe entrano nel risultato secondo i join del diagramma.
querybuilder.tree.column.tooltip=Una colonna della query. Con il tasto destro si modifica o si toglie.
querybuilder.tree.expression.tooltip=Un'espressione calcolata dalla query (per esempio una funzione o un conto). Con il tasto destro si modifica o si toglie.
querybuilder.tree.condition.tooltip=Una condizione della query. Con il tasto destro si modifica o si toglie.
querybuilder.tree.sort.tooltip=Un criterio di ordinamento: la colonna e il verso (ASC crescente, DESC decrescente). Con il tasto destro si modifica o si toglie.
querybuilder.tree.group.tooltip=Una colonna del raggruppamento: le righe con lo stesso valore diventano una riga sola. Con il tasto destro si toglie.
querybuilder.tree.item.tooltip=Un elemento della query. Con il tasto destro si modifica o si toglie.

