querybuilder.join.matchingOnly=Solo le righe che corrispondono
querybuilder.join.allRowsOf=Tutte le righe di {0}
querybuilder.join.matchingOnly.tooltip=INNER JOIN: nel risultato entrano solo le coppie di righe che soddisfano la condizione del collegamento. Una riga senza corrispondenza nell'altra tabella non compare.
querybuilder.join.allRowsOf.tooltip=OUTER JOIN (LEFT o RIGHT): nel risultato entrano tutte le righe di questa tabella; dove nell'altra non c'è una riga corrispondente, le sue colonne valgono NULL.
querybuilder.entity.close=Togli la tabella dalla query
