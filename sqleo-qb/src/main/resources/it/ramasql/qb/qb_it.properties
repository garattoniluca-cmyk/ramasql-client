# RamaSQL (2026-09-28, T12.3/T12.9): titoli delle finestre, etichette e suggerimenti di menu e finestre
querybuilder.title.database_object.edit=Alias della tabella
querybuilder.title.condition.edit=Condizione
querybuilder.title.expression.edit=Espressione
querybuilder.title.join.edit=Collegamento fra le tabelle (join)
querybuilder.alias.identifier=Tabella:
querybuilder.alias.identifier.tooltip=Il nome della tabella (o della sottoquery) così come compare nella query: non si cambia da qui.
querybuilder.alias.alias=Alias:
querybuilder.alias.alias.tooltip=Un nome breve per la tabella dentro questa query (per esempio «l» per libri): nell'SQL diventa «libri AS l». Vuoto = nessun alias.
querybuilder.expression.alias=Alias:
querybuilder.expression.alias.tooltip=Il nome della colonna nel risultato (per esempio «numero_prestiti»): nell'SQL diventa «… AS numero_prestiti». Vuoto = il server sceglie il nome.
querybuilder.expression.value.tooltip=L'espressione da calcolare per ogni riga, scritta in SQL: una funzione come COUNT(*) o SUM(prezzo), un calcolo come prezzo * 1.22, un testo fra apici.
querybuilder.condition.predicate.tooltip=Come si lega alle condizioni precedenti: AND (devono valere tutte) oppure OR (basta che ne valga una).
querybuilder.condition.operator.tooltip=Il confronto fra i due lati: = uguale, <> diverso, < > minore e maggiore, LIKE con i caratteri jolly % e _, IN in un elenco, IS NULL per i valori mancanti, BETWEEN fra due valori.
querybuilder.condition.subquery.tooltip=Il lato destro diventa una sottoquery (una SELECT dentro la condizione): si costruisce poi nell'albero, come la query principale.
querybuilder.condition.left.tooltip=Il lato sinistro della condizione: di solito una colonna, per esempio libri.anno.
querybuilder.condition.right.tooltip=Il lato destro della condizione: un valore (i testi fra apici, per esempio 'Torino'), un'altra colonna o un elenco fra parentesi per IN.
querybuilder.join.operator.tooltip=Il confronto fra le due colonne del collegamento: quasi sempre = (le righe si uniscono quando i valori sono uguali).
querybuilder.join.allRowsFrom.tooltip=Tiene nel risultato tutte le righe di questa tabella, anche quelle senza corrispondenza nell'altra (OUTER JOIN): le colonne mancanti restano NULL.
querybuilder.menu.foreignTables.tooltip=Le tabelle che hanno una chiave esterna verso questa: doppio clic per aggiungerle al diagramma.
querybuilder.menu.primaryTables.tooltip=Le tabelle a cui questa rimanda con le sue chiavi esterne: doppio clic per aggiungerle al diagramma.
application.ok.tooltip=Conferma e applica alla query quello che hai scritto nella finestra.
application.close.tooltip=Chiude la finestra senza cambiare la query.
querybuilder.menu.select=Nel risultato (SELECT)
querybuilder.menu.select.tooltip=Acceso: la colonna compare nel risultato. Spento: la colonna resta usabile nelle condizioni ma non si mostra.
querybuilder.menu.distinct=DISTINCT (senza righe doppie)
querybuilder.menu.distinct.tooltip=Il risultato non ripete le righe uguali: nell'SQL diventa SELECT DISTINCT.
querybuilder.action.arrangeentitiesgrid.tooltip=Mette le tabelle del diagramma in una griglia ordinata, le une accanto alle altre. L'SQL non cambia.
querybuilder.action.arrangeentitiesspring.tooltip=Dispone le tabelle secondo i collegamenti, con le più collegate al centro. L'SQL non cambia.
querybuilder.action.copySyntax.tooltip=Copia negli appunti il testo SQL della query, da incollare nell'editor SQL o in un documento.
querybuilder.action.packEntities.tooltip=Riduce ogni tabella del diagramma alla sua misura minima. L'SQL non cambia.
querybuilder.action.removeEntities.tooltip=Toglie tutte le tabelle dalla query: il diagramma si svuota e l'SQL ricomincia da capo. Chiede conferma.
querybuilder.action.saveDiagramAsImage.tooltip=Salva il diagramma in un'immagine PNG, da mettere in una relazione o da proiettare.
querybuilder.menu.addCondition.tooltip=Aggiunge una condizione a questa clausola, scritta in una finestra con i due lati e il confronto.
querybuilder.menu.addExpression.tooltip=Aggiunge al risultato una colonna calcolata: una funzione come COUNT o SUM, o un calcolo, con il suo nome (alias).
querybuilder.menu.addHavingCondition.tooltip=Aggiunge una condizione sui gruppi (HAVING), controllata dopo il raggruppamento: per esempio COUNT(*) > 3.
querybuilder.menu.addSubquery.tooltip=Aggiunge una sottoquery: una SELECT dentro la query, da costruire nell'albero come quella principale.
querybuilder.menu.addToGroupBy.tooltip=Raggruppa le righe per questa colonna: le funzioni come COUNT o SUM si calcolano per ogni gruppo.
querybuilder.menu.addToGroupBySyncSelect.tooltip=Mette nel GROUP BY tutte le colonne scelte nel risultato che non sono funzioni, come chiede l'SQL.
querybuilder.menu.addToOrderBy.tooltip=Ordina il risultato secondo questa colonna; il verso (crescente o decrescente) si sceglie poi con «Modifica…».
querybuilder.menu.addWhereCondition.tooltip=Aggiunge una condizione WHERE su questa colonna: nel risultato entrano solo le righe che la rispettano.
querybuilder.menu.deselectAll.tooltip=Toglie dal risultato tutte le colonne di questa tabella (la tabella resta nella query).
querybuilder.menu.edit.tooltip=Modifica l'elemento scelto nell'albero: la condizione, l'espressione, l'alias o il verso dell'ordinamento.
querybuilder.menu.openAllForeignTables.tooltip=Aggiunge al diagramma tutte le tabelle che hanno una chiave esterna verso questa, già collegate.
querybuilder.menu.openAllPrimaryTables.tooltip=Aggiunge al diagramma tutte le tabelle a cui questa rimanda con le sue chiavi esterne, già collegate.
querybuilder.menu.pack.tooltip=Riduce la tabella alla misura minima che mostra tutte le colonne.
querybuilder.menu.references.tooltip=Mostra le tabelle collegate a questa dalle chiavi esterne, nei due versi, per aggiungerle al diagramma.
querybuilder.menu.remove.tooltip=Toglie dalla query l'elemento scelto (una colonna, una condizione, un collegamento). Il database non cambia.
querybuilder.menu.removeAll.tooltip=Toglie tutti gli elementi di questa clausola (per esempio tutte le condizioni del WHERE).
querybuilder.menu.selectAll.tooltip=Mette nel risultato tutte le colonne di questa tabella.
querybuilder.menu.sortByName.tooltip=Mette in ordine alfabetico le colonne mostrate nella tabella del diagramma. L'SQL non cambia.
querybuilder.menu.union.tooltip=Unisce al risultato quello di un'altra SELECT (UNION): le due query devono avere lo stesso numero di colonne.
querybuilder.join.condition.tooltip=Apre la finestra del collegamento, per cambiare il confronto fra le due colonne o tenere tutte le righe di una tabella.
querybuilder.operator.eq.tooltip=Uguale: la condizione vale quando i due lati hanno lo stesso valore (per i testi conta la collation).
querybuilder.operator.lt.tooltip=Minore: vale quando il lato sinistro è più piccolo del destro (numeri, date, o testi in ordine alfabetico).
querybuilder.operator.gt.tooltip=Maggiore: vale quando il lato sinistro è più grande del destro (numeri, date, o testi in ordine alfabetico).
querybuilder.operator.le.tooltip=Minore o uguale: come «minore», ma vale anche quando i due lati sono uguali.
querybuilder.operator.ge.tooltip=Maggiore o uguale: come «maggiore», ma vale anche quando i due lati sono uguali.
querybuilder.operator.ne.tooltip=Diverso (forma standard dell'SQL): vale quando i due lati hanno valori diversi. Con un valore NULL non vale mai: per i mancanti si usa IS NULL.
querybuilder.operator.ne2.tooltip=Diverso (forma di MySQL e MariaDB, uguale a <>): vale quando i due lati hanno valori diversi, mai con NULL.
querybuilder.operator.like.tooltip=Somiglia a un modello di testo: % vale qualunque sequenza di caratteri, _ un carattere solo. Per esempio 'Ros%' trova Rossi e Rossini.
querybuilder.operator.notlike.tooltip=Non somiglia al modello di testo (% qualunque sequenza, _ un carattere): il contrario di LIKE.
querybuilder.operator.is.tooltip=Per i valori mancanti: «IS NULL» trova le righe dove il valore manca. Con = NULL non si trova nulla.
querybuilder.operator.isnot.tooltip=Per i valori presenti: «IS NOT NULL» trova le righe dove il valore c'è.
querybuilder.operator.in.tooltip=Il valore è in un elenco fra parentesi, per esempio IN ('Torino', 'Milano'), o nel risultato di una sottoquery.
querybuilder.operator.notin.tooltip=Il valore non è nell'elenco (o nel risultato della sottoquery). Attenzione: se l'elenco contiene NULL non vale per nessuna riga.
querybuilder.operator.exists.tooltip=Vale se la sottoquery restituisce almeno una riga: si usa con una sottoquery collegata alla riga esterna.
querybuilder.operator.notexists.tooltip=Vale se la sottoquery non restituisce nessuna riga: per esempio i soci senza prestiti.
querybuilder.operator.between.tooltip=Il valore sta fra due estremi, compresi: BETWEEN 1990 AND 1999. Vale per numeri, date e testi.
querybuilder.operator.notbetween.tooltip=Il valore sta fuori dai due estremi: il contrario di BETWEEN.
querybuilder.operator.and.tooltip=AND: la riga deve rispettare sia questa condizione sia le precedenti.
querybuilder.operator.or.tooltip=OR: alla riga basta rispettare questa condizione oppure le precedenti. Attenzione: mescolato con AND, conviene usare le parentesi.
querybuilder.message.aliasRequired=Scrivi un alias valido: un nome breve, senza spazi.
querybuilder.message.aliasRequired.title=Alias mancante
textview.cut=Taglia
textview.copy=Copia
textview.paste=Incolla
textview.delete=Cancella
textview.selectAll=Seleziona tutto
textview.clearAll=Svuota
querybuilder.message.noConnection=Il query builder non ha una connessione al server: ricollegati e riprova.
querybuilder.message.aliasNotFound=Nell''SQL c''è una tabella o un alias che la query non conosce: {0}
querybuilder.field.select.tooltip=La colonna «{0}»: spuntala per metterla nel risultato (SELECT). Tasto destro per aggiungere condizioni o espressioni su di lei.
querybuilder.message.unionAll=La query visiva non distingue UNION ALL da UNION: nel diagramma diventa UNION, che toglie le righe doppie.
querybuilder.message.limitInSubquery=LIMIT in una sottoquery non si può disegnare: resta solo nel testo SQL.
querybuilder.message.conditionAliasNotFound=Una condizione usa una tabella o un alias che la query non conosce: {0}
querybuilder.message.joinConditionToWhere=Le condizioni scritte nel JOIN diventano condizioni del WHERE nel diagramma (il risultato non cambia): {0}
