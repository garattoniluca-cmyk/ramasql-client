#
# Tema RamaSQL (derivato da FlatLightLaf): traduce i TOKEN di docs/DESIGN-SYSTEM.md §1 nelle chiavi di FlatLaf.
# FlatLaf lo carica da solo, per nome di classe, accanto a it.ramasql.app.theme.RamaSqlLaf.
# I valori devono coincidere con le costanti di it.ramasql.app.theme.Tokens (lo verifica ThemeTokensTest).
#
# Token (§1.1)                 bg.window #F6F7F9 · bg.surface #FFFFFF · bg.sunken #EEF1F5
#                              border.subtle #E4E7EC · border.default #D0D5DD
#                              text.primary #101828 · text.secondary #475467 · text.tertiary #98A2B3
#                              accent #2563EB · hover #1D4ED8 · pressed #1E40AF · tint #EAF1FF
#                              success #16A34A · warning #D97706 · danger #DC2626
# Raggi (§1.3): FlatLaf vuole il DIAMETRO dell'arco: raggio 6 -> arc 12, raggio 12 -> arc 24.

#---- tipografia (§1.2) -------------------------------------------------------------------------------------------
# Segoe UI Variable Text (Windows 11) -> Segoe UI. La dimensione la fissano le impostazioni (SettingsController):
# tutte le altre misure del carattere sono in PERCENTUALE, quindi scalano insieme (proiettore).
defaultFont = 13 "Segoe UI Variable Text", "Segoe UI"
monospaced.font = "Cascadia Mono", Consolas, Monospaced
[win]monospaced.font = "Cascadia Mono", Consolas, Monospaced

rama.display.font = 185% $semibold.font
rama.heading.font = 138% $semibold.font
rama.title.font = 115% $semibold.font
rama.emphasis.font = $semibold.font
rama.small.font = 92%
rama.caption.font = 85%

[style].display = font: $rama.display.font
[style].heading = font: $rama.heading.font
[style].title = font: $rama.title.font
[style].emphasis = font: $rama.emphasis.font
[style].smallText = font: $rama.small.font
[style].caption = font: $rama.caption.font

