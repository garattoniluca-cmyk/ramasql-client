er.suggest.tooltip=Cerca relazioni che le chiavi esterne non dicono, dai nomi delle colonne (id_editore → editori.id, socio_id → soci.id…). Le proposte compaiono a destra: nessuna si applica da sola.
er.layout=Disponi
er.layout.tooltip=Ridispone le tabelle in automatico, senza sovrapporle: le più collegate al centro. Le posizioni scelte a mano si perdono.
er.layout.done=Tabelle ridisposte: le più collegate al centro.
er.refresh=Aggiorna dal database
er.refresh.tooltip=Rilegge le tabelle dal server: colonne nuove o cambiate si aggiornano, le tabelle sparite restano segnate come mancanti. Le posizioni e le relazioni logiche restano come sono.
er.refresh.disconnected=Serve una connessione al server del modello: collegati dalla finestra principale.
er.refresh.running=Rileggo le tabelle dal server…
er.refresh.done=Modello aggiornato dal database: posizioni e relazioni logiche conservate.
er.refresh.added=Tabelle nuove: %s.
er.refresh.changed=Tabelle con colonne o indici cambiati: %s.
er.refresh.missing=Tabelle che non ci sono più nel database (restano segnate in rosso): %s.
er.refresh.failed=Aggiornamento non riuscito: %s
er.refresh.otherServer=Il modello viene dal server %s, ma ora sei collegato a %s: aggiornarlo leggerebbe le tabelle di un altro server (un catalogo con lo stesso nome può essere diverso). Collegati al server del modello.
er.refresh.broken=Relazioni logiche che nominano colonne che non ci sono più (in rosso): %s. Eliminale o ridisegnale.
er.refresh.promoted=Diventate chiavi esterne vere sul server (ora sono relazioni fisiche, a tratto pieno): %s.
er.refresh.overlaps=Alcune tabelle ora si sovrappongono (hanno più colonne): «Disponi» le rimette in ordine.
er.open.disconnected=Per aprire la struttura di «%s» serve la connessione al server del modello.
er.open.otherServer=«%s» viene dal server %s, ma ora sei collegato a %s: la tabella con lo stesso nome qui potrebbe essere un'altra.
er.open.missing=«%s» non c'è più nel database: non c'è una struttura da aprire.
er.export.tooBig=Il diagramma è troppo grande per un'immagine: rimpicciolisci con meno tabelle.
er.refresh.noCatalog=Sul server collegato non c'è il catalogo «%s» del modello.
er.export=Esporta PNG…
er.export.tooltip=Salva il diagramma come immagine PNG, al doppio della grandezza sullo schermo: nitida per la stampa e per il proiettore.
er.export.done=Immagine salvata: «%s» (%s × %s pixel).
er.export.failed=L'immagine non si è potuta salvare: %s
er.save=Salva
er.save.tooltip=Salva il modello nel file .rsqlmodel (la prima volta chiede dove): tabelle, posizioni e relazioni logiche. Il database non viene toccato.
er.save.done=Modello salvato in «%s».
er.save.failed=Il modello non si è potuto salvare in «%s»: %s
er.zoomOut.tooltip=Rimpicciolisci il diagramma (anche Ctrl + rotella del mouse).
er.zoomIn.tooltip=Ingrandisci il diagramma (anche Ctrl + rotella del mouse).
er.zoom.tooltip=Ingrandimento del diagramma.
er.canvas.tooltip=Trascina l'intestazione di una tabella per spostarla; trascina da una colonna a una colonna di un'altra tabella per disegnare una relazione logica; doppio clic su una tabella per aprirne la struttura. Da tastiera: Tab sceglie la tabella, le frecce la spostano, Invio la apre; F6 sceglie una relazione, Canc la elimina se è logica, Maiusc+F10 ne apre il menu.
er.canvas.entity.tooltip=Tabella «%s». Trascinala per spostarla; doppio clic per aprirne la struttura nell'editor di tabelle.
er.canvas.column.tooltip=Colonna «%2$s» di «%1$s». Trascinala sulla colonna di un'altra tabella per disegnare una relazione logica: parti dalla colonna che contiene i riferimenti (lato «molti») e arriva alla colonna riferita (di solito la chiave, lato «uno»).
er.canvas.physical.tooltip=Relazione fisica (chiave esterna del server): %s · %s · %s. Il tratto pieno dice che il database la controlla davvero.
er.canvas.logical.tooltip=Relazione logica (solo nel modello, tratteggiata): %s · %s · %s. Il database non la conosce e non la controlla: serve a leggere e a spiegare lo schema.
er.cardinality.ONE_TO_ONE=Uno a uno (1:1)
er.cardinality.ONE_TO_MANY=Uno a molti (1:N)
er.cardinality.MANY_TO_MANY=Molti a molti (N:M, indicativa)
er.cardinality.ONE_TO_ONE.tooltip=A ogni riga del padre corrisponde al più una riga della figlia (per esempio una persona e il suo passaporto). Nel database: la colonna della figlia è UNIQUE.
er.cardinality.ONE_TO_MANY.tooltip=A ogni riga del padre possono corrispondere molte righe della figlia (un editore, molti libri). È il caso più comune.
er.cardinality.MANY_TO_MANY.tooltip=Molte righe da una parte e molte dall'altra (libri e autori). Nel database si realizza con una tabella ponte e due relazioni uno a molti: qui è solo un'indicazione.
er.mandatory.yes=obbligatoria
er.mandatory.no=facoltativa
er.entity.missing=mancante
er.entity.bridge=N:M
er.entity.myisam=MyISAM
er.relationship.physical=Chiave esterna «%s» del database (si cambia dall'editor di tabelle)
er.relationship.physical.tooltip=Le relazioni fisiche vengono dalle chiavi esterne del server: per cambiarle si apre la struttura della tabella.
er.relationship.label=Etichetta…
er.relationship.label.tooltip=Una parola o due che dicono che cosa significa la relazione (per esempio «scrive» fra autori e libri); si vede sulla linea.
er.relationship.label.message=Etichetta della relazione %s (vuota per toglierla):
er.relationship.delete=Elimina la relazione logica
er.relationship.delete.tooltip=Toglie la relazione dal modello. Il database non cambia: le relazioni logiche esistono solo nel file del modello.
er.suggestions.title=Relazioni suggerite
er.suggestions.table.tooltip=Le relazioni proposte guardando i nomi delle colonne, con quanto sono probabili. Passa sopra una riga per leggere il perché; togli la spunta a quelle che non vuoi.
er.suggestions.column.0=
er.suggestions.column.1=Relazione
er.suggestions.column.2=Fiducia
er.suggestions.accept=Accetta le spuntate
er.suggestions.accept.tooltip=Le proposte spuntate diventano relazioni logiche del modello (tratteggiate). Il database non viene toccato.
er.suggestions.close=Chiudi
er.suggestions.close.tooltip=Chiude l'elenco delle proposte senza accettarne altre.
er.suggestions.none=Nessuna relazione da suggerire: ogni colonna che sembra un riferimento è già in una relazione.
er.suggestions.found=%s relazioni suggerite: controllale a destra e accetta quelle giuste.
er.suggestions.accepted=%s relazioni logiche aggiunte al modello.
er.draw.exists=C'è già una relazione da %s verso «%s».
er.draw.done=Relazione logica disegnata: %s.
er.draw.types=Attenzione: i tipi delle due colonne sono diversi (%s e %s): come chiave esterna vera non funzionerebbe.
