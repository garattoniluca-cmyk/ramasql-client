import.target.existing.tooltip=Le righe si aggiungono a una tabella che c'è già. Le colonne del file si abbinano da sole a quelle della tabella con lo stesso nome; puoi cambiare l'abbinamento nella griglia.
import.target.new=In una tabella nuova
import.target.new.tooltip=Il programma crea una tabella nuova (CREATE TABLE), con una colonna per ogni colonna del file e il tipo dedotto dai valori. Puoi cambiare nomi e tipi prima di importare.
import.target.table.tooltip=La tabella del catalogo in cui aggiungere le righe.
import.target.newName.tooltip=Il nome della tabella nuova. Usa lettere minuscole, cifre e trattino basso, senza spazi.
import.mapping.table.tooltip=Per ogni colonna del file, la colonna della tabella che riceverà i valori. «Non importare» lascia fuori la colonna del file. Una colonna della tabella non abbinata riceve il suo valore predefinito.
import.mapping.editor.tooltip=Scegli la colonna della tabella per questa colonna del file, oppure «non importare».
import.mapping.skip=— non importare —
import.mapping.column.0=Colonna del file
import.mapping.column.1=Esempio
import.mapping.column.2=Colonna della tabella
import.newTable.table.tooltip=Le colonne della tabella nuova. Nome e tipo si possono cambiare con un doppio clic; nella colonna «Perché» c'è il motivo del tipo proposto.
import.newTable.type.tooltip=Il tipo SQL della colonna, scelto dall'elenco o scritto a mano (per esempio VARCHAR(80) o DECIMAL(8,2)).
import.newTable.column.0=Colonna
import.newTable.column.1=Tipo
import.newTable.column.2=NULL
import.newTable.column.3=Perché questo tipo
import.newTable.null.yes=sì
import.newTable.null.no=no
import.target.addKey=Aggiungi la chiave primaria «id» (numero automatico)
import.target.addKey.tooltip=Aggiunge in testa una colonna id INT UNSIGNED AUTO_INCREMENT come chiave primaria, se il file non ha già una colonna id con numeri tutti diversi. Senza chiave primaria la tabella si potrebbe solo leggere nel data-entry, non modificare.
import.target.sql.tooltip=L'istruzione CREATE TABLE che creerà la tabella nuova. Si aggiorna mentre cambi nomi e tipi.
import.target.noAnalysis=Il file non è ancora stato letto.
import.target.noName=Scrivi il nome della tabella nuova.
import.target.tooLong=Il nome della tabella è lungo %s caratteri: il server ne ammette al massimo 64.
import.target.emptyColumn=Una colonna del file non ha nome: scrivine uno nella griglia.
import.target.columnTooLong=Il nome della colonna «%s» è troppo lungo: al massimo 64 caratteri.
import.target.keyNotInteger=La chiave primaria «%s» è un numero automatico (AUTO_INCREMENT) e deve essere un intero, non %s.
import.target.exists=Nel catalogo c'è già una tabella o una vista «%s»: scegli un altro nome, oppure importa nella tabella esistente.
import.target.duplicateColumn=Due colonne si chiamano «%s»: i nomi delle colonne devono essere diversi.
import.target.badType=Il tipo «%2$s» della colonna «%1$s» non è scritto correttamente (esempi: INT, VARCHAR(50), DECIMAL(8,2)).
import.target.noTable=Scegli la tabella.
import.plan.noColumns=Scegli almeno una colonna da importare.
import.target.twice=La colonna «%s» della tabella è abbinata a due colonne del file: ognuna può ricevere una sola colonna.
import.target.required=La colonna «%s» della tabella è obbligatoria (NOT NULL, senza valore predefinito) ma nessuna colonna del file la riempie: il server rifiuterà ogni riga.
import.options.intro=Come trattare i dati
import.option.truncate=Svuota la tabella prima di importare (TRUNCATE TABLE)
import.option.truncate.tooltip=Cancella tutte le righe che la tabella ha adesso, poi importa il file. Attenzione: non si può annullare, e ti verrà chiesto di confermare riscrivendo una parola. Non funziona se altre tabelle la usano con chiavi esterne.
import.option.duplicates.label=Righe già presenti
import.option.duplicates.tooltip=Che cosa fare con una riga la cui chiave (primaria o UNIQUE) è già nella tabella.
import.option.duplicates.error=Segnalale come errore nel rapporto
import.option.duplicates.ignore=Saltale (ignora i duplicati)
import.option.emptyNull=Un valore vuoto vale NULL
import.option.emptyNull.tooltip=Se è spuntata, una cella vuota del file diventa NULL (nessun valore). Se la togli, nelle colonne di testo diventa un testo vuoto «»; nelle colonne numeriche e di date resta comunque NULL.
import.option.dates.label=Formato delle date
import.option.dates.tooltip=Come sono scritte le date con le barre nel file. «Come nel file» usa quello riconosciuto colonna per colonna; le date ISO (anno-mese-giorno) si leggono sempre.
import.option.dates.auto=Come nel file (riconosciuto)
import.option.dates.DMY=giorno/mese/anno (italiano)
import.option.dates.MDY=mese/giorno/anno (americano)
import.option.dates.YMD=anno-mese-giorno (ISO)
import.options.summary=Si importeranno %s righe nella tabella «%s».
import.option.truncate.referenced=«Svuota prima» non si può usare: la tabella «%s» è riferita dalle chiavi esterne di %s, e il server rifiuta TRUNCATE su una tabella riferita anche se le altre tabelle sono vuote.
import.options.dates.DMY=Date lette come giorno/mese/anno: %s.
import.options.dates.MDY=Date lette come mese/giorno/anno: %s.
import.options.dates.YMD=Date lette come anno-mese-giorno: %s.
import.options.summary.truncate=La tabella «%2$s» verrà prima svuotata, poi si importeranno %1$s righe.
import.run.intro=Importazione
import.run.summary=%1$s righe nella tabella «%2$s», a lotti di %4$s righe al massimo (lotti previsti: %3$s).\nOgni lotto è una sola istruzione INSERT, in autocommit. Premi «Importa»: prima vedrai l'SQL.
import.run.progress=%s righe lette su %s · %s inserite · lotti: %s
import.run.progress.tooltip=Quante righe del file sono state lette e quante sono già sul server.
import.run.stop=Interrompi
import.run.stop.tooltip=Ferma l'importazione dopo l'istruzione in corso. Le righe già inserite restano nella tabella (non c'è una transazione che le annulli) e il rapporto dice quante sono.
import.run.stopping=Interruzione in corso…
import.run.stopFailed=Interruzione non riuscita: %s
import.run.nothingToStop=Non c'era niente da fermare in questo momento: se l'importazione continua, premi di nuovo «Interrompi».
import.run.cancelled=Importazione annullata: nulla è stato scritto.
import.run.notStarted=L'importazione non è partita: l'istruzione prima dell'inserimento non è riuscita (guarda la scheda Messaggi).
import.run.openTable=Apri la tabella
import.run.openTable.tooltip=Apre la tabella nel data-entry, per vedere le righe importate.
import.run.rejected.tooltip=Le righe del file che non sono state importate, con la riga del file e il motivo. Correggile nel file e importale di nuovo.
import.rejected.column.0=Riga
import.rejected.column.1=Motivo
import.rejected.server=Messaggio del server: [%s] %s
import.report.done=Fatto: %s righe lette, %s inserite, %s scartate, %s duplicati ignorati · lotti: %s.
import.report.interrupted=Interrotta: %s righe lette, %s inserite (restano nella tabella), %s scartate, %s duplicati ignorati · lotti: %s.
import.report.stopped=Fermata per un errore: %s righe lette, %s inserite (restano nella tabella), %s scartate, %s duplicati ignorati · lotti: %s.
import.report.more=Altre %s righe scartate non sono elencate.
