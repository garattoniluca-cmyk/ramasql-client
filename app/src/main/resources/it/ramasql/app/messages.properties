editor.error.explain.1064=L'SQL non è scritto correttamente (errore di sintassi). Guarda il punto evidenziato: spesso manca una virgola o un apice, c'è una parola chiave sbagliata o nel posto sbagliato.
editor.error.explain.1146=La tabella indicata non esiste nel catalogo in uso: controlla il nome o il catalogo (USE).
editor.error.explain.1054=La colonna indicata non esiste: controlla il nome e, se usi un alias, a quale tabella appartiene.
editor.error.explain.1062=Valore duplicato: esiste già una riga con lo stesso valore nella chiave primaria o in un indice UNIQUE.
editor.error.explain.1451=Non si può eliminare o modificare questa riga: altre righe la usano attraverso una chiave esterna.
editor.error.explain.1452=Il valore non esiste nella tabella riferita dalla chiave esterna: prima va inserita la riga «padre».
editor.error.explain.1265=Un valore non entra nella colonna: è troppo lungo (o non adatto) per il nuovo tipo. Allarga la colonna, oppure correggi i dati che non ci stanno.
editor.error.explain.1406=Un valore non entra nella colonna: è troppo lungo per il tipo scelto. Allarga la colonna, oppure accorcia i dati più lunghi.
editor.error.explain.3780=I tipi delle due colonne non combaciano: una chiave esterna vuole colonne dello stesso tipo, con lo stesso segno e la stessa collation.
editor.error.explain.1832=La colonna è usata da una chiave esterna: per cambiarne il tipo bisogna prima togliere la chiave esterna.
editor.error.explain.1045=Accesso negato: nome utente o password non corretti.
editor.error.explain.1044=L'utente non ha il permesso di usare questo catalogo.
editor.error.explain.1049=Il catalogo (database) indicato non esiste.
editor.error.explain.1050=Esiste già una tabella o una vista con questo nome.
editor.error.explain.1136=Il numero di valori non corrisponde al numero di colonne dell'INSERT.
editor.error.explain.1366=Il valore non è adatto al tipo della colonna (per esempio un testo in una colonna numerica o una data scritta male).
editor.error.explain.1292=La data o il numero non sono scritti in un formato che il server riconosce (le date si scrivono anno-mese-giorno).
editor.error.explain.1264=Il numero è fuori dall'intervallo ammesso dal tipo della colonna: troppo grande, troppo piccolo o negativo in una colonna UNSIGNED.
editor.error.explain.3819=Il valore non rispetta un vincolo CHECK della tabella.
editor.error.explain.1644=La riga è stata rifiutata da un trigger della tabella (SIGNAL): il messaggio del server dice perché.
editor.error.explain.1048=La colonna non ammette NULL: serve un valore.
editor.error.explain.1317=L'istruzione è stata interrotta su richiesta.
editor.error.explain.1356=La vista non è più valida: usa tabelle, colonne o viste che non esistono più (forse sono state eliminate o rinominate). Si corregge ricreando ciò che manca, oppure con «Modifica vista».
editor.error.explain.1060=Due colonne hanno lo stesso nome: in una vista (o in una tabella) i nomi delle colonne devono essere diversi. Dai un alias a una delle due (es. libri.id AS id_libro).
editor.error.explain.1215=Il server non ha potuto creare la chiave esterna. Di solito la colonna riferita non è una chiave (serve un indice, meglio la chiave primaria) oppure le due colonne hanno tipi diversi (per esempio INT e INT UNSIGNED): correggi e riprova.
editor.error.explain.1005=La tabella o la chiave esterna non si è potuta creare. Se il messaggio cita «errno: 150», la chiave esterna è scritta male: la colonna riferita deve avere un indice e lo stesso tipo della colonna che la riferisce, e la tabella deve essere InnoDB.
editor.error.explain.1822=Manca l'indice sulla colonna riferita: una chiave esterna può puntare solo a una colonna che è chiave (primaria o UNIQUE) nella tabella «padre».
