# ================================================================ Step 12: spiegazioni delle voci delle liste (ADR-020)
tableeditor.type.args=Tra parentesi: %s (per i testi la lunghezza massima in caratteri, per i decimali le cifre in tutto e quelle dopo la virgola).
tableeditor.type.INT.tooltip=Numero intero da circa -2,1 miliardi a +2,1 miliardi (4 byte). È la scelta normale per chiavi, conteggi e codici numerici. Con UNSIGNED niente negativi e il doppio dei positivi.
tableeditor.type.TINYINT.tooltip=Numero intero piccolo, da -128 a 127 (da 0 a 255 se UNSIGNED), 1 byte. Va bene per voti, età, piccoli contatori; TINYINT(1) si usa spesso come sì/no.
tableeditor.type.SMALLINT.tooltip=Numero intero da -32 768 a 32 767 (0–65 535 se UNSIGNED), 2 byte. Utile per anni, pagine, quantità che non superano qualche decina di migliaia.
tableeditor.type.MEDIUMINT.tooltip=Numero intero da circa -8,4 milioni a +8,4 milioni (3 byte). Si usa poco: di solito basta INT.
tableeditor.type.BIGINT.tooltip=Numero intero enorme, fino a circa 9,2 miliardi di miliardi (8 byte). Serve solo quando INT non basta, per esempio per contatori molto grandi o identificativi esterni lunghi.
tableeditor.type.DECIMAL.tooltip=Numero con la virgola memorizzato in modo esatto: DECIMAL(6,2) ha 6 cifre in tutto, 2 dopo la virgola (fino a 9999,99). È il tipo giusto per prezzi e importi, dove gli arrotondamenti non sono ammessi.
tableeditor.type.FLOAT.tooltip=Numero con la virgola approssimato, con circa 7 cifre significative (4 byte). Va bene per misure scientifiche. Attenzione: non usarlo per i soldi, 0,1 + 0,2 può non fare esattamente 0,3; per gli importi usa DECIMAL.
tableeditor.type.DOUBLE.tooltip=Numero con la virgola approssimato, con circa 15 cifre significative (8 byte). Più preciso di FLOAT, ma sempre approssimato. Attenzione: per prezzi e importi usa DECIMAL.
tableeditor.type.BIT.tooltip=Una sequenza di bit, da 1 a 64: BIT(1) è un singolo sì/no. Si legge e si scrive come b'101'. Per un semplice vero/falso è più chiaro BOOLEAN.
tableeditor.type.VARCHAR.tooltip=Testo di lunghezza variabile fino al massimo indicato: VARCHAR(60) accetta fino a 60 caratteri e occupa solo quelli usati. È il tipo normale per nomi, cognomi, email, titoli.
tableeditor.type.CHAR.tooltip=Testo di lunghezza fissa: CHAR(5) occupa sempre 5 caratteri. Adatto a codici che hanno sempre la stessa lunghezza, come CAP, sigle di provincia o codici fiscali.
tableeditor.type.TEXT.tooltip=Testo lungo, fino a circa 64 000 caratteri, per descrizioni e note. Non ha una lunghezza da scegliere e non può avere un valore predefinito semplice; per testi brevi è meglio VARCHAR.
tableeditor.type.TINYTEXT.tooltip=Testo lungo al massimo 255 byte. Si usa raramente: VARCHAR(255) fa la stessa cosa ed è più flessibile.
tableeditor.type.MEDIUMTEXT.tooltip=Testo molto lungo, fino a circa 16 milioni di caratteri: articoli, pagine intere, documenti in formato testo.
tableeditor.type.LONGTEXT.tooltip=Testo enorme, fino a 4 GB. Serve solo in casi particolari; per note e descrizioni basta TEXT.
tableeditor.type.ENUM.tooltip=Un valore scelto da un elenco fisso scritto nella definizione, per esempio ENUM('bozza','pubblicato'). Utile per stati con poche possibilità. Attenzione: per aggiungere una voce bisogna modificare la struttura della tabella.
tableeditor.type.SET.tooltip=Zero, uno o più valori scelti da un elenco fisso, per esempio SET('lun','mar','mer') con il valore 'lun,mer'. Si usa poco: di solito è meglio una tabella collegata.
tableeditor.type.DATE.tooltip=Una data senza ora, da '1000-01-01' a '9999-12-31', scritta come 'aaaa-mm-gg'. Per compleanni, scadenze, date di prestito.
tableeditor.type.DATETIME.tooltip=Data e ora insieme ('aaaa-mm-gg hh:mm:ss'), sempre come le si scrive, senza fuso orario. Adatto a appuntamenti e orari di un evento.
tableeditor.type.TIMESTAMP.tooltip=Un istante preciso nel tempo, convertito secondo il fuso orario della connessione; va dal 1970 al 2038. Si usa per «creato il» e «modificato il», spesso con DEFAULT CURRENT_TIMESTAMP.
tableeditor.type.TIME.tooltip=Un'ora del giorno o una durata ('hh:mm:ss'), anche negativa o oltre le 24 ore (fino a 838 ore). Per orari di lezione o tempi di gara.
tableeditor.type.YEAR.tooltip=Un anno a quattro cifre, dal 1901 al 2155 (1 byte). Per anni di pubblicazione o di nascita quando non serve la data intera.
tableeditor.type.BOOLEAN.tooltip=Vero o falso. In MariaDB e MySQL è un sinonimo di TINYINT(1): vale 1 per vero e 0 per falso.
tableeditor.type.BLOB.tooltip=Dati binari (byte) fino a circa 64 KB: piccole immagini o file. Il client li mostra in esadecimale e non li modifica nella griglia. Di solito è meglio salvare i file su disco e nel database solo il percorso.
tableeditor.type.MEDIUMBLOB.tooltip=Dati binari fino a circa 16 MB, per esempio immagini o documenti. Attenzione: righe così grandi rallentano letture e dump.
tableeditor.type.LONGBLOB.tooltip=Dati binari fino a 4 GB. Serve solo in casi particolari. Attenzione: file così grandi nel database rendono lenti copie e ripristini.
tableeditor.type.BINARY.tooltip=Byte di lunghezza fissa, per esempio BINARY(16) per un identificativo UUID compatto. Il confronto è byte per byte, senza regole di maiuscole o accenti.
tableeditor.type.VARBINARY.tooltip=Byte di lunghezza variabile fino al massimo indicato. Come VARCHAR, ma per dati binari: il confronto è byte per byte.
tableeditor.type.JSON.tooltip=Un documento JSON (oggetti ed elenchi annidati). MySQL lo controlla e lo memorizza in forma binaria; in MariaDB è un testo con il controllo che sia JSON valido. Utile per dati poco strutturati, non al posto di colonne e tabelle.
tableeditor.engine.InnoDB.tooltip=Il motore consigliato e quello predefinito. Controlla davvero le chiavi esterne (integrità referenziale), non perde i dati se il computer si spegne all'improvviso e blocca solo le righe che sta modificando. Sceglilo sempre, salvo motivi particolari.
tableeditor.engine.MyISAM.tooltip=Motore vecchio, più semplice. Non controlla le chiavi esterne: le relazioni esistono solo sulla carta. Attenzione: dopo uno spegnimento improvviso una tabella MyISAM può rovinarsi e va riparata, e non c'è modo di annullare un'istruzione a metà.
charset.default=(quello del catalogo)
charset.default.tooltip=Nessuna scelta: la tabella usa il set di caratteri del catalogo in cui si trova. Va bene quasi sempre, così tutto il catalogo è coerente.
charset.utf8mb4.tooltip=Unicode completo: tutte le lingue, i simboli e le emoji, fino a 4 byte per carattere. È la scelta consigliata per ogni tabella nuova.
charset.utf8mb3.tooltip=Unicode senza i caratteri oltre i 3 byte: niente emoji e niente alcuni ideogrammi rari. Esiste per le tabelle vecchie (si chiamava «utf8»). Attenzione: un'emoji inserita qui dà errore o diventa «?»; per le tabelle nuove usa utf8mb4.
charset.latin1.tooltip=Set di caratteri dell'Europa occidentale, 1 byte per carattere: lettere accentate italiane sì, ma niente alfabeti diversi né emoji. Attenzione: si incontra nei database vecchi; per le tabelle nuove usa utf8mb4.
charset.ascii.tooltip=Solo i 128 caratteri inglesi di base: niente lettere accentate. Adatto solo a codici e sigle; per testi scritti da persone usa utf8mb4.
charset.other.tooltip=Il set di caratteri «%s» dice quali lettere e simboli si possono memorizzare e con quanti byte. Per testi in italiano e in altre lingue la scelta consigliata è utf8mb4.
collation.default=(quella del set di caratteri)
collation.default.tooltip=Nessuna scelta: si usa la collation predefinita del set di caratteri. Decide come si confrontano e si ordinano i testi; va bene quasi sempre.
collation.part.charset=Collation del set di caratteri %s: decide come si confrontano e si ordinano i testi (uguaglianze, ORDER BY, indici UNIQUE).
collation.part.bin=Confronto binario, byte per byte: «a» e «A» sono diverse, «e» ed «è» anche, e l'ordine segue i codici dei caratteri.
collation.part.uca.recent=Regole Unicode recenti: ordina correttamente le lettere di quasi tutte le lingue.
collation.part.uca=Regole Unicode (versione più vecchia): ordina bene le lettere accentate delle lingue europee.
collation.part.general=Regole semplificate, più veloci ma meno precise nell'ordinare lettere accentate e caratteri speciali.
collation.part.language=Regole di una lingua precisa (il nome lo dice), per ordinare come in quella lingua.
collation.part.ai=«ai»: gli accenti non contano, «perche» e «perché» sono uguali.
collation.part.as=«as»: gli accenti contano, «perche» e «perché» sono diversi.
collation.part.ci=«ci»: maiuscole e minuscole non contano, «Rossi» e «rossi» sono uguali (anche per un indice UNIQUE).
collation.part.cs=«cs»: maiuscole e minuscole contano, «Rossi» e «rossi» sono diversi.
collation.part.nopad=Gli spazi in fondo contano nei confronti: «abc» e «abc » sono diversi.
tableeditor.fk.action.RESTRICT.tooltip=Rifiuta l'operazione sulla riga «padre» finché ci sono righe «figlie» che la riferiscono: per eliminare un editore bisogna prima eliminare o spostare i suoi libri. È la scelta più prudente e quella predefinita.
tableeditor.fk.action.CASCADE.tooltip=L'operazione sulla riga «padre» si ripete su tutte le righe «figlie»: eliminando un editore si eliminano anche tutti i suoi libri; cambiando il suo id cambia anche nei libri. Attenzione: con ON DELETE CASCADE un solo DELETE può cancellare moltissime righe in più tabelle, senza altre domande.
tableeditor.fk.action.SET_NULL.tooltip=Quando la riga «padre» si elimina (o cambia chiave), nelle righe «figlie» la colonna di riferimento diventa NULL: i libri restano, ma senza editore. Attenzione: funziona solo se quella colonna ammette NULL; altrimenti il server rifiuta di creare la chiave.
tableeditor.fk.action.NO_ACTION.tooltip=In MariaDB e MySQL con InnoDB si comporta come RESTRICT: rifiuta l'operazione sulla riga «padre» se ha righe «figlie». Il nome viene dallo standard SQL, dove il controllo può essere rimandato; qui non c'è differenza pratica.
tableeditor.index.kind.PRIMARY.tooltip=La chiave primaria: identifica ogni riga in modo unico, non ammette NULL, e ce n'è una sola per tabella. Senza, la tabella nella griglia è di sola lettura e le altre tabelle non la possono riferire bene.
tableeditor.index.kind.UNIQUE.tooltip=Indice che vieta i valori ripetuti (ma ammette più NULL): per email, tessere, codici fiscali. Rende anche veloci le ricerche su quella colonna. Attenzione: se la tabella ha già dei duplicati, il server rifiuta di crearlo.
tableeditor.index.kind.INDEX.tooltip=Indice normale: rende veloci ricerche, ordinamenti e unioni su quella colonna, e ammette valori ripetuti. Costa un po' di spazio e rallenta di poco inserimenti e modifiche.
dump.content.BOTH.tooltip=Nel file vanno la struttura (CREATE TABLE) e tutte le righe (INSERT): ripristinandolo si riottiene la tabella com'è ora. È la scelta per una copia di sicurezza completa.
dump.content.STRUCTURE.tooltip=Nel file va solo la struttura (CREATE TABLE), senza righe: serve a ricreare tabelle vuote, per esempio per un esercizio da rifare da capo.
dump.content.DATA.tooltip=Nel file vanno solo le righe (INSERT), senza CREATE TABLE: per ricaricare i dati in una tabella che esiste già con la stessa struttura. Attenzione: se la tabella di destinazione ha già quelle chiavi, il ripristino dà errori di duplicato.
settings.language.it.tooltip=Menu, messaggi e suggerimenti in italiano. Il cambio vale dal prossimo avvio del programma.
settings.language.en.tooltip=Menus and messages in English (translation in preparation: some texts may still be in Italian). Italiano: il cambio vale dal prossimo avvio.
import.kind.CSV.tooltip=Testo con una riga per record e i valori separati da un carattere (punto e virgola, virgola o tabulazione), come lo salva Excel. Il programma riconosce da solo separatore, codifica e intestazione.
import.kind.JSON.tooltip=Un elenco di oggetti JSON, uno per riga della tabella: [{"id": 1, "nome": "Anna"}, …]. Le chiavi diventano colonne; oggetti ed elenchi annidati si importano come testo JSON.
import.charset.UTF_8.tooltip=La codifica di quasi tutti i file moderni: tutte le lingue ed emoji. Il programma la riconosce da sola quando il file la usa.
import.charset.windows_1252.tooltip=La codifica dei file salvati come «CSV» da Excel e dal Blocco note in italiano: lettere accentate sì, emoji no. Se in anteprima vedi «Ã¨» al posto di «è», il file è in questa codifica.
import.charset.UTF_16LE.tooltip=Unicode a 2 byte, «little endian»: la usano alcuni programmi Windows (Excel «Testo Unicode»). Di solito il file comincia con un segno (BOM) che il programma riconosce.
import.charset.UTF_16BE.tooltip=Unicode a 2 byte, «big endian»: rara su Windows. Sceglila solo se l'anteprima con le altre codifiche mostra caratteri strani o spazi tra le lettere.
import.separator.semicolon.tooltip=Punto e virgola: il separatore dei CSV di Excel in italiano (dove la virgola serve per i decimali).
import.separator.comma.tooltip=Virgola: il separatore dei CSV inglesi e di molti programmi. I valori che contengono una virgola sono tra virgolette.
import.separator.tab.tooltip=Tabulazione: il separatore dei file «testo delimitato» e di ciò che si copia da un foglio di calcolo.
import.separator.pipe.tooltip=Barra verticale «|»: separatore usato da alcuni gestionali, perché compare raramente nei testi.
import.option.duplicates.error.tooltip=Una riga con una chiave già presente nella tabella viene scartata e compare nel rapporto come errore, con la riga del file: sai esattamente quali righe non sono entrate.
import.option.duplicates.ignore.tooltip=Una riga con una chiave già presente viene saltata senza segnalarla come errore (si contano i «duplicati ignorati»). Utile per reimportare un file aggiornato. Attenzione: le righe saltate non aggiornano quelle esistenti.
import.option.dates.auto.tooltip=Il programma guarda tutte le date di ogni colonna e decide se sono gg/mm/aaaa, mm/gg/aaaa o aaaa-mm-gg: quando un numero supera 12 non ci sono dubbi. È la scelta consigliata.
import.option.dates.DMY.tooltip=Giorno/mese/anno, come si scrive in Italia: 14/06/1953 è il 14 giugno.
import.option.dates.MDY.tooltip=Mese/giorno/anno, come negli Stati Uniti: 06/14/1953 è il 14 giugno. Attenzione: 03/04/2020 diventa il 4 marzo, non il 3 aprile.
import.option.dates.YMD.tooltip=Anno-mese-giorno, il formato dei database e dello standard ISO: 1953-06-14.
script.target.fromScript.tooltip=Le istruzioni vanno nel catalogo che il file sceglie da sé con USE o CREATE DATABASE (i dump di un catalogo intero). Il programma non aggiunge nessun USE.
script.target.none.tooltip=Nessun catalogo scelto: scegline uno dall'elenco per eseguire lo script. Il programma non ne sceglie uno al posto tuo, perché uno script con DROP TABLE potrebbe cancellare le tabelle sbagliate.
script.target.catalog.tooltip=Prima dello script si esegue USE `%s`: le tabelle senza catalogo nel nome finiscono qui. Attenzione: se lo script contiene DROP TABLE, le tabelle con quel nome in questo catalogo si eliminano.
tableeditor.refTable.tooltip=Tabella «%s»: la chiave esterna punterà a una sua colonna, di solito la chiave primaria (%s). Ogni valore della colonna di questa tabella dovrà esistere lì.
tableeditor.refTable.noKey=nessuna chiave primaria
tableeditor.column.item.tooltip=La colonna «%s» di questa tabella, di tipo %s%s%s.
tableeditor.column.item.notNull=, obbligatoria (NOT NULL)
tableeditor.column.item.nullable=, facoltativa (ammette NULL)
tableeditor.column.item.key=; fa parte della chiave primaria
import.table.item.tooltip=Tabella «%s» del catalogo: le righe del file si aggiungono alle sue, abbinando le colonne per nome (si può correggere).
import.mapping.item.tooltip=La colonna del file finisce nella colonna «%s» della tabella.
import.mapping.skip.tooltip=Questa colonna del file non si importa: i suoi valori si ignorano.

# ================================================================ Step 12: suggerimenti dei componenti nati prima di ADR-020
menu.file.tooltip=Profili di connessione, modelli ER, impostazioni e uscita dal programma.
menu.help.tooltip=La guida rapida e le informazioni sul programma (versione, licenza, attribuzioni).
menu.file.importProfiles.tooltip=Aggiunge le connessioni da un file .json preparato dall'insegnante: nessuna password viene importata, la chiede il programma al momento di collegarsi.
menu.file.exportProfiles.tooltip=Salva le connessioni in un file .json da distribuire agli studenti. Le password non ci sono mai: ognuno le scrive quando si collega.
menu.file.settings.tooltip=Le quattro impostazioni del programma: lingua, dimensione del carattere, righe lette per volta, cartella di lavoro.
menu.file.exit.tooltip=Chiude il programma. Se ci sono dati non confermati, script in esecuzione o modelli non salvati, prima chiede che cosa fare.
home.tile.tooltip=Connessione «%s» a %s con l'utente %s. Clic (o Invio) per collegarti: la password si chiede ogni volta e non si salva. Tasto destro per modificarla o eliminarla.
navigator.filter.tooltip=Scrivi parte di un nome per vedere solo i cataloghi, le tabelle e le viste che lo contengono.
nav.tip.server=Il server %s a cui sei collegato. Qui sotto i suoi cataloghi (database); tasto destro per crearne uno nuovo.
nav.tip.catalog=Il catalogo (database) «%s»: contiene tabelle e viste. Tasto destro per creare una tabella, esportarlo, aggiornarlo o eliminarlo.
nav.tip.tables=Le tabelle del catalogo: apri il gruppo per vederle; tasto destro su una tabella per aprirla, progettarla o importarvi dati.
nav.tip.views=Le viste del catalogo: query salvate con un nome, che si leggono come tabelle. Tasto destro per aprirle o modificarle.
nav.tip.routines=Procedure e funzioni memorizzate del catalogo: si possono solo vedere (il loro SQL con «Mostra SQL di creazione»).
nav.tip.table=La tabella «%s». Tasto destro per aprirla (dati), progettarla (struttura), importarvi dati, esportarla o eliminarla.
nav.tip.view=La vista «%s»: una query salvata con un nome. Tasto destro per aprirla (i suoi dati) o modificarla nella query visiva.
nav.tip.routine=La routine «%s» (procedura o funzione memorizzata). Tasto destro per vedere il suo SQL.
nav.tip.columns=Le colonne della tabella, con tipo e opzioni: la struttura si cambia con «Progetta tabella…».
nav.tip.indexes=Gli indici della tabella (chiave primaria, UNIQUE, normali): rendono veloci le ricerche e impediscono i duplicati.
nav.tip.foreignKeys=Le chiavi esterne della tabella: i collegamenti verso altre tabelle, che il server controlla.
nav.tip.column=La colonna «%s»: il tipo e le opzioni sono accanto al nome.
nav.tip.index=L'indice «%s»: le colonne che ordina sono accanto al nome.
nav.tip.foreignKey=La chiave esterna «%s»: la tabella e le colonne che riferisce sono accanto al nome.
nav.tip.message=Un messaggio del navigatore (per esempio un errore di lettura): passa sopra per leggerlo tutto.
nav.menu.newCatalog.tooltip=Crea un catalogo (database) vuoto sul server: scegli nome, set di caratteri e collation; prima di eseguire vedi l'SQL (CREATE DATABASE).
nav.menu.showSystem.tooltip=Mostra anche i cataloghi del server (mysql, information_schema, sys…): contengono i dati di funzionamento del server e di solito non si toccano.
nav.menu.newTable.tooltip=Apre l'editor di tabelle per una tabella nuova in questo catalogo: colonne, chiavi, indici, e l'SQL CREATE TABLE che verrà eseguito.
nav.menu.export.tooltip=Apre la procedura «Esporta / Dump» già su questo oggetto: salva struttura e dati in un file .sql.
nav.menu.dropCatalog.tooltip=Elimina il catalogo con tutte le sue tabelle e i dati (DROP DATABASE). Chiede di riscrivere il nome per conferma. Attenzione: non si può annullare.
nav.menu.refresh.tooltip=Rilegge dal server il contenuto di questo nodo (F5): serve se qualcuno ha cambiato il database da un altro programma.
nav.menu.openTable.tooltip=Apre i dati della tabella nella griglia: si leggono, si modificano, si aggiungono righe; niente va al server prima di «Conferma».
nav.menu.designTable.tooltip=Apre la struttura della tabella nell'editor di tabelle: colonne, indici, chiavi esterne, opzioni.
nav.menu.importData.tooltip=Apre «Importa dati» con questa tabella già scelta come destinazione: righe da un file CSV o JSON.
nav.menu.rename.tooltip=Cambia il nome della tabella (RENAME TABLE). Le chiavi esterne che la riferiscono si aggiornano da sole; le query salvate che la nominano no.
nav.menu.truncate.tooltip=Cancella tutte le righe della tabella lasciando la struttura (TRUNCATE TABLE). Chiede di riscrivere il nome. Attenzione: non si può annullare.
nav.menu.dropTable.tooltip=Elimina la tabella con tutti i suoi dati (DROP TABLE). Chiede di riscrivere il nome. Attenzione: non si può annullare.
nav.menu.showCreate.tooltip=Mostra l'SQL con cui il server ricreerebbe questo oggetto (SHOW CREATE): utile per studiarlo o copiarlo.
nav.menu.copyName.tooltip=Copia negli appunti il nome della tabella, da incollare nell'editor SQL.
nav.menu.openView.tooltip=Apre i dati della vista nella griglia (in sola lettura se la vista non si può aggiornare).
nav.menu.editView.tooltip=Riapre la vista nella query visiva, dove la si modifica graficamente o in SQL e la si salva di nuovo.
nav.menu.dropView.tooltip=Elimina la vista (DROP VIEW). I dati delle tabelle non cambiano: sparisce solo la query salvata.
sqlPanel.log.tooltip=Tutto quello che il programma ha eseguito sul server, in ordine, con esito e durata. Si esporta come script .sql.
sqlPanel.preview.tooltip=L'SQL dell'ultima operazione proposta, prima che venga eseguito.
sqlPanel.messages.tooltip=I messaggi delle operazioni: gli esiti, gli errori spiegati e gli avvisi del server.
panel.log.filter.tooltip=Scrivi una parola per vedere solo le righe del registro che la contengono (nell'SQL, nell'origine o nell'errore).
panel.log.table.column.0.tooltip=Numero progressivo dell'istruzione nella sessione.
panel.log.table.column.1.tooltip=Ora in cui l'istruzione è finita.
panel.log.table.column.2.tooltip=Da dove è partita: editor SQL, navigatore, griglia, editor di tabelle, query visiva, importazione, esportazione, script da file.
panel.log.table.column.3.tooltip=L'istruzione SQL eseguita (le lunghissime abbreviate). Passa sopra una riga per leggerla tutta.
panel.log.table.column.4.tooltip=Riuscita, errore (con il codice del server) o interrotta.
panel.log.table.column.5.tooltip=Quanto ci ha messo il server, in millisecondi.
panel.log.table.column.6.tooltip=Righe lette (SELECT) o modificate (INSERT, UPDATE, DELETE).
sqlEditor.text.tooltip=Scrivi qui l'SQL. Ctrl+Invio esegue l'istruzione dove sta il cursore, Ctrl+Maiusc+Invio tutto; Ctrl+Spazio completa i nomi; Ctrl+/ commenta le righe.
sqlEditor.results.0.tooltip=Una riga per istruzione eseguita: esito, durata, avvisi. Le linguette accanto contengono i risultati delle SELECT.
sqlEditor.outcomes.column.0.tooltip=Il numero dell'istruzione nello script, nell'ordine in cui si è eseguita.
sqlEditor.outcomes.column.1.tooltip=L'istruzione eseguita (la prima riga).
sqlEditor.outcomes.column.2.tooltip=Riuscita, righe lette o modificate, oppure l'errore del server spiegato.
sqlEditor.outcomes.column.3.tooltip=Il tempo che il server ha impiegato per questa istruzione, in millisecondi.
sqlEditor.outcomes.column.4.tooltip=Avvisi del server (per esempio valori troncati): passa sopra per leggerli.
dataGrid.view.grid.tooltip=Mostra i dati come tabella, una riga per record.
dataGrid.view.form.tooltip=Mostra un record alla volta come modulo, con un campo per colonna: comodo per tabelle con molte colonne.
dataGrid.export.tooltip=Salva le righe mostrate in un file CSV da aprire con Excel (punto e virgola, UTF-8).
dataGrid.discard.tooltip=Butta via tutte le modifiche non ancora confermate: la griglia torna com'era sul server. Nulla viene inviato.
dataGrid.rowHeader.tooltip=Il numero della riga; «+» per le righe nuove, «−» per quelle da eliminare, il triangolino per le celle modificate. Niente va al server prima di «Conferma».
recordForm.previous.tooltip=Torna al record precedente (le modifiche restano in attesa di «Conferma»).
recordForm.next.tooltip=Passa al record successivo (le modifiche restano in attesa di «Conferma»).
recordForm.new.tooltip=Aggiunge un record nuovo, da compilare: arriva al server solo con «Conferma».
recordForm.delete.tooltip=Segna il record da eliminare: si elimina davvero solo con «Conferma».
recordForm.field.tooltip=Colonna «%s» (%s)%s. Le modifiche arrivano al server solo con «Conferma».
recordForm.field.notNull=, obbligatoria
tableeditor.tabs.0.tooltip=Le colonne della tabella: nome, tipo, lunghezza, chiave primaria e le altre opzioni.
tableeditor.tabs.1.tooltip=Gli indici: chiave primaria, UNIQUE e normali. Rendono veloci le ricerche e impediscono i duplicati.
tableeditor.tabs.2.tooltip=Le chiavi esterne: i collegamenti con altre tabelle e che cosa succede quando la riga «padre» cambia o si elimina.
tableeditor.tabs.3.tooltip=Nome della tabella, motore (InnoDB o MyISAM), set di caratteri, collation, commento.
tableeditor.tabs.4.tooltip=L'SQL che «Applica» eseguirà (CREATE TABLE o ALTER TABLE), aggiornato mentre modifichi.
columns.table.column.0.tooltip=Stato della colonna: nuova, modificata, da eliminare; un errore si legge passando sopra.
columns.table.column.1.tooltip=Il nome della colonna: lettere, cifre e «_», senza spazi (per convenzione in minuscolo).
columns.table.column.2.tooltip=Il tipo dei valori (INT, VARCHAR, DATE…). Apri l'elenco: ogni tipo ha la sua spiegazione.
columns.table.column.3.tooltip=La lunghezza (VARCHAR(60)), le cifre (DECIMAL(6,2)) o i valori permessi (ENUM('a','b')), secondo il tipo.
columns.table.column.4.tooltip=PK, chiave primaria: la colonna identifica ogni riga in modo unico e non può essere vuota.
columns.table.column.5.tooltip=NN, NOT NULL: la colonna è obbligatoria, ogni riga deve avere un valore.
columns.table.column.6.tooltip=UQ, UNIQUE: nessuna ripetizione, due righe non possono avere lo stesso valore (NULL escluso).
columns.table.column.7.tooltip=AI, AUTO_INCREMENT: il server assegna da solo il numero successivo alle righe nuove. Solo per una colonna intera che è chiave.
columns.table.column.8.tooltip=UN, UNSIGNED: niente numeri negativi, e il doppio dei positivi. Solo per i tipi numerici.
columns.table.column.9.tooltip=Il valore predefinito: si usa quando una riga nuova non ne indica uno (un numero, 'un testo', NULL, CURRENT_TIMESTAMP).
columns.table.column.10.tooltip=Una nota sulla colonna, salvata nel database: la leggono anche gli altri programmi.
columns.add.tooltip=Aggiunge una colonna in fondo (o sotto quella scelta): scrivi nome e tipo nella riga nuova.
columns.remove.tooltip=Segna la colonna scelta da eliminare. Attenzione: con «Applica» i suoi dati si perdono per tutte le righe.
tableeditor.revert.tooltip=Butta via le modifiche non applicate: l'editor torna alla struttura letta dal server.
tableeditor.apply.tooltip=Mostra l'SQL (CREATE o ALTER TABLE), lo esegue dopo la conferma e rilegge la tabella dal server per mostrarti com'è davvero.
indexes.table.column.0.tooltip=Stato dell'indice: nuovo, modificato, da eliminare; un errore si legge passando sopra.
indexes.table.column.1.tooltip=Il nome dell'indice (la chiave primaria si chiama sempre PRIMARY).
indexes.table.column.2.tooltip=Il tipo: chiave primaria, UNIQUE o indice normale. Apri l'elenco per la spiegazione di ciascuno.
indexes.table.column.3.tooltip=Le colonne dell'indice, nell'ordine: si scelgono nel riquadro a destra.
indexes.add.tooltip=Aggiunge un indice: poi scegli il tipo e le colonne.
indexes.remove.tooltip=Segna l'indice scelto da eliminare (DROP INDEX con «Applica»). I dati non cambiano; le ricerche su quelle colonne diventano più lente.
indexes.columns.tooltip=Le colonne dell'indice, nell'ordine in cui le usa: l'ordine conta per le ricerche che partono dalla prima.
indexes.addColumn.tooltip=Aggiunge all'indice la colonna scelta nell'elenco accanto.
indexes.removeColumn.tooltip=Toglie dall'indice la colonna scelta.
indexes.up.tooltip=Sposta la colonna scelta più in alto nell'indice.
indexes.down.tooltip=Sposta la colonna scelta più in basso nell'indice.
indexes.verifyData.tooltip=Controlla sul server se i dati attuali rispettano l'indice UNIQUE, prima di crearlo: elenca i valori ripetuti.
fks.table.column.0.tooltip=Stato della chiave esterna: nuova, modificata, da eliminare; un errore si legge passando sopra.
fks.table.column.1.tooltip=Il nome della chiave esterna (se lo lasci vuoto, lo sceglie il server).
fks.table.column.2.tooltip=La tabella «padre» a cui puntano i valori di questa tabella. Apri l'elenco: per ognuna vedi la chiave.
fks.table.column.3.tooltip=Le colonne di questa tabella che contengono i riferimenti, e quelle della tabella riferita (si scelgono sotto).
fks.table.column.4.tooltip=ON DELETE: che cosa succede alle righe di questa tabella quando la riga «padre» si elimina. Apri l'elenco per la spiegazione di ogni scelta.
fks.table.column.5.tooltip=ON UPDATE: che cosa succede quando la chiave della riga «padre» cambia. Apri l'elenco per la spiegazione di ogni scelta.
fks.add.tooltip=Aggiunge una chiave esterna: poi scegli la tabella riferita e le coppie di colonne.
fks.remove.tooltip=Segna la chiave esterna scelta da eliminare: i dati non cambiano, ma il server smette di controllare il collegamento.
fks.pairs.column.0.tooltip=La colonna di questa tabella che contiene il riferimento.
fks.pairs.column.1.tooltip=La colonna riferita nella tabella «padre», di solito la sua chiave primaria (stesso tipo).
fks.addPair.tooltip=Aggiunge una coppia di colonne alla chiave esterna (per le chiavi fatte da più colonne).
fks.removePair.tooltip=Toglie la coppia di colonne scelta dalla chiave esterna.
fks.verifyData.tooltip=Controlla sul server se ci sono righe «orfane», con valori che non esistono nella tabella riferita: con quelle la chiave non si potrebbe creare.
options.name.tooltip=Il nome della tabella: lettere, cifre e «_», senza spazi. Cambiarlo è un RENAME TABLE.
options.autoIncrement.tooltip=Il prossimo numero che AUTO_INCREMENT darà a una riga nuova. Di solito non si tocca.
options.comment.tooltip=Una nota sulla tabella, salvata nel database.
preview.cancel.tooltip=Non esegue nulla e chiude l'anteprima. Il database resta com'è.
preview.execute.tooltip=Esegue l'SQL mostrato sul server, un'istruzione dopo l'altra, e scrive tutto nel registro.
preview.typeToConfirm.tooltip=Per le operazioni che cancellano dati, riscrivi qui il nome indicato: così non si conferma per sbaglio.
catalog.create.name.tooltip=Il nome del catalogo: lettere, cifre e «_», senza spazi, al massimo 64 caratteri.
catalog.create.confirm.tooltip=Mostra l'SQL CREATE DATABASE nell'anteprima; il catalogo si crea solo dopo la conferma.
dialog.cancel.tooltip=Chiude la finestra senza fare nulla.
profile.name.tooltip=Il nome del riquadro nella schermata iniziale, per esempio «Laboratorio».
profile.host.tooltip=Indirizzo del server: localhost se il server è su questo computer, altrimenti il nome o l'indirizzo IP.
profile.port.tooltip=La porta del server: 3306 di solito per MariaDB e MySQL (3307 se ce ne sono due sullo stesso computer).
profile.user.tooltip=Il nome utente del database (non quello di Windows). La password si chiede al momento di collegarsi e non si salva.
profile.catalog.tooltip=Facoltativo: il catalogo da aprire subito dopo il collegamento.
profile.note.tooltip=Una nota per chi usa la connessione (per esempio a che cosa serve).
profile.test.tooltip=Prova a collegarsi con questi dati (chiede la password) e dice se funziona, o perché no, senza salvare.
profile.save.tooltip=Salva la connessione: comparirà come riquadro nella schermata iniziale. La password non si salva.
settings.fontSize.tooltip=La dimensione del carattere di tutto il programma: più grande per il proiettore. Si cambia anche con Ctrl+rotella del mouse.
settings.rowLimit.tooltip=Quante righe mostrare per pagina nelle griglie: con tabelle grandi, più righe vuol dire più attesa a ogni pagina.
settings.workDirectory.tooltip=La cartella proposta per aprire e salvare file (script, CSV, dump, modelli).
settings.browse.tooltip=Sceglie la cartella di lavoro.
settings.save.tooltip=Salva le impostazioni e le applica subito (la lingua dal prossimo avvio).
connection.error.ok.tooltip=Chiude la finestra: puoi correggere la connessione e riprovare.
er.tables.cancel.tooltip=Chiude la finestra senza creare il modello: nessuna tabella viene letta.
showCreate.copy.tooltip=Copia l'SQL negli appunti, da incollare nell'editor SQL.
showCreate.close.tooltip=Chiude la finestra con l'SQL di creazione.
sqlEditor.results.result.tooltip=Le righe restituite da una SELECT dello script: si scorrono, si copiano, si esportano in CSV.
