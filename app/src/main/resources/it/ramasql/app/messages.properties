er.canvas.column.tooltip=Colonna «%2$s» di «%1$s». Trascinala sulla colonna di un'altra tabella per disegnare una relazione logica: parti dalla colonna che contiene i riferimenti (lato «molti») e arriva alla colonna riferita (di solito la chiave, lato «uno»).
er.canvas.physical.tooltip=Relazione fisica (chiave esterna del server): %s · %s · %s. Il tratto pieno dice che il database la controlla davvero.
er.canvas.logical.tooltip=Relazione logica (solo nel modello, tratteggiata): %s · %s · %s. Il database non la conosce e non la controlla: serve a leggere e a spiegare lo schema.
