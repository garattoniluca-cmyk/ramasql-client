# verifica dopo l'applicazione (core.verify, ADR-011)
verify.ok=✔ verificato sul server: indici e chiavi esterne di «%s» sono quelli chiesti
verify.differences=Il server non ha applicato esattamente ciò che è stato chiesto per «%s»: %s differenze
verify.table.missing=La tabella «%s» non c'è sul server.
verify.pk.missing=La chiave primaria (%2$s) non c'è sul server.
verify.index.missing=L'indice «%s» (%s) non c'è sul server.
verify.index.name=L'indice chiesto con il nome «%s» sul server si chiama «%s».
verify.index.uniqueness=L'indice «%s» doveva essere %s, sul server è %s.
verify.index.order=L'indice «%s» ha le colonne in un altro ordine: chiesto (%s), sul server (%s). L'ordine conta: l'indice serve alle ricerche che partono dalla prima colonna.
verify.index.columns=L'indice «%s» ha colonne diverse: chiesto (%s), sul server (%s).
verify.index.unexpected=Sul server c'è l'indice «%s» (%s), che non era stato chiesto.
verify.index.notDropped=L'indice «%s» (%s) doveva essere eliminato, ma è ancora sul server.
verify.index.implicit=Il server ha creato da sé l'indice «%s» (%s) per la chiave esterna «%s»: una chiave esterna ha sempre bisogno di un indice sulle sue colonne.
verify.index.leftByFk=L'indice «%s» (%s) era stato creato per una chiave esterna ora eliminata: il server lo conserva. Se non serve, lo puoi eliminare.
verify.fk.missing=La chiave esterna «%s» (%s → %s) non c'è sul server.
verify.fk.missingEngine=La chiave esterna «%s» (%s → %s) non c'è sul server: la tabella usa l'engine %s, che accetta l'istruzione ma ignora le chiavi esterne. Convertila in InnoDB.
verify.fk.name=La chiave esterna chiesta con il nome «%s» sul server si chiama «%s».
verify.fk.nameAssigned=Il server ha chiamato «%s» la chiave esterna senza nome (%s → %s).
verify.fk.order=La chiave esterna «%s» ha le colonne in un altro ordine: chiesto (%s), sul server (%s).
verify.fk.columns=La chiave esterna «%s» ha colonne diverse: chiesto (%s), sul server (%s).
verify.fk.refTable=La chiave esterna «%s» riferisce un'altra tabella: chiesta «%s», sul server «%s».
verify.fk.refColumns=La chiave esterna «%s» riferisce altre colonne: chieste (%s), sul server (%s).
verify.fk.action=La chiave esterna «%s» ha un'altra azione %s: chiesta %s, sul server %s.
verify.fk.actionEquivalent=La chiave esterna «%s» ha %s %s chiesto e %s sul server: in InnoDB le due regole sono identiche (il vincolo si controlla subito), quindi il comportamento è quello chiesto.
verify.fk.unexpected=Sul server c'è la chiave esterna «%s» (%s → %s), che non era stata chiesta.
verify.fk.notDropped=La chiave esterna «%s» (%s → %s) doveva essere eliminata, ma è ancora sul server.

# --- importazione CSV e JSON (Step 9): errori del file
import.csv.unclosedQuote=Il file CSV non è valido: alla riga %s si aprono delle virgolette che non si chiudono più fino alla fine del file (il record comincia alla riga %s). Controlla che ogni campo racchiuso tra virgolette abbia le sue virgolette di chiusura.
import.json.empty=Il file JSON è vuoto.
import.json.notArray=Il file JSON deve contenere un elenco di oggetti tra parentesi quadre, [ {…}, {…} ]: alla riga %s, colonna %s, comincia invece con qualcos'altro.
import.json.afterEnd=Il file JSON continua dopo la parentesi quadra di chiusura dell'elenco (riga %s, colonna %s): c'è del testo in più.
import.json.truncated=Il file JSON finisce all'improvviso (riga %s, colonna %s): manca la chiusura di un oggetto o dell'elenco.
import.json.notObject=Alla riga %s, colonna %s, l'elenco contiene un valore che non è un oggetto {…}: si importano solo elenchi di oggetti, uno per riga della tabella.
import.json.invalid=Il file JSON non è valido alla riga %s, colonna %s: %s
import.json.why.char=c'è il carattere «%s» dove si aspettava un valore, una virgola o una parentesi (spesso manca una virgola, o c'è una virgola di troppo).
import.json.why.token=la parola «%s» non è un valore JSON (i testi vanno tra virgolette doppie; i valori ammessi sono numeri, testi, true, false, null).
import.json.why.end=il file finisce prima di chiudere un oggetto, un testo o l'elenco.
import.json.why.close=c'è una parentesi di chiusura che non corrisponde a quella aperta.
import.json.why.control=un testo contiene un a-capo o un carattere di controllo non scritto con la barra rovesciata.
import.json.why.other=la struttura non è quella di un file JSON.

# --- importazione: tipi dedotti (perché questo tipo)
import.type.empty=La colonna è sempre vuota: non si sa che cosa conterrà, quindi si propone del testo.
import.type.nested=Contiene oggetti o elenchi annidati: si conservano come testo JSON.
import.type.boolean=Contiene solo valori logici (vero/falso, sì/no, true/false): BOOLEAN, cioè TINYINT(1) con 1 = vero e 0 = falso.
import.type.int=Contiene solo numeri interi (da %s a %s).
import.type.bigint=Contiene numeri interi troppo grandi per INT (da %s a %s): BIGINT.
import.type.hugeInteger=Contiene numeri troppo lunghi anche per BIGINT: sono codici, si conservano come testo.
import.type.plusSign=Alcuni valori cominciano con il segno + (come i numeri di telefono con il prefisso internazionale): sono codici, non numeri. Si conservano come testo.
import.type.codeName=Il nome della colonna dice che è un codice (telefono, CAP, ISBN, matricola…): anche se fatto di cifre non si fanno calcoli con i codici, e come numero perderebbe gli zeri iniziali o il +. Si conserva come testo.
import.type.leadingZero=Alcuni valori cominciano con uno zero (come i CAP o i numeri di telefono): sono codici, non numeri, e come numeri perderebbero lo zero iniziale. Si conservano come testo.
import.type.double=Contiene numeri in notazione scientifica o con troppe cifre: DOUBLE (numero approssimato).
import.type.decimalComma=Contiene numeri con la virgola decimale all'italiana: fino a %s cifre prima della virgola e %s dopo.
import.type.decimalDot=Contiene numeri con il punto decimale: fino a %s cifre prima del punto e %s dopo.
import.type.date.DMY=Contiene date nel formato giorno/mese/anno, tutte esistenti.
import.type.date.MDY=Contiene date nel formato mese/giorno/anno (all'americana), tutte esistenti.
import.type.date.YMD=Contiene date nel formato anno-mese-giorno, tutte esistenti.
import.type.datetime.DMY=Contiene date con l'ora, nel formato giorno/mese/anno ore:minuti.
import.type.datetime.MDY=Contiene date con l'ora, nel formato mese/giorno/anno ore:minuti (all'americana).
import.type.datetime.YMD=Contiene date con l'ora, nel formato anno-mese-giorno ore:minuti.
import.type.time=Contiene solo orari (ore:minuti).
import.type.mediumtext=Contiene testi molto lunghi (fino a %s caratteri): MEDIUMTEXT.
import.type.text=Contiene testi lunghi (fino a %s caratteri): TEXT.
import.type.char=Tutti i valori hanno la stessa lunghezza, %s caratteri (un codice): CHAR a lunghezza fissa.
import.type.varchar=Testo lungo al massimo %s caratteri: VARCHAR con un po' di margine.

