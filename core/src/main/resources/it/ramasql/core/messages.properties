# Testi del modulo core rivolti all'utente (italiano). Segnaposto di String.format: %s.

# --- controlli preventivi delle chiavi esterne
precheck.fk.childEngine=La tabella «%s» usa l'engine %s, che non supporta le chiavi esterne: il vincolo verrebbe ignorato. Convertila in InnoDB.
precheck.fk.parentEngine=La tabella riferita «%s» usa l'engine %s, che non supporta le chiavi esterne. Convertila in InnoDB.
precheck.fk.columnCount=Una chiave esterna deve avere lo stesso numero di colonne sui due lati (almeno una): qui sono %s e %s.
precheck.fk.columnNotFound=La colonna «%s» non esiste nella tabella «%s».
precheck.fk.type=Tipi diversi: «%s» è %s ma la colonna riferita «%s» è %s. Le due colonne devono avere lo stesso tipo.
precheck.fk.sign=Segno diverso: «%s» è %s ma la colonna riferita «%s» è %s. Devono essere entrambe UNSIGNED o entrambe con segno.
precheck.fk.collation=Charset o collation diversi: «%s» usa %s ma la colonna riferita «%s» usa %s. Per le colonne di testo devono coincidere.
precheck.fk.notIndexed=Le colonne riferite (%s) non sono le prime colonne di un indice o della chiave primaria di «%s»: crea prima l'indice.
precheck.fk.setNullNotNull=SET NULL non è possibile: la colonna «%s» è NOT NULL. Rendila annullabile o scegli un'altra azione.

# --- controlli preventivi degli indici
precheck.index.columnNotFound=La colonna «%s» non esiste nella tabella «%s».
precheck.index.invalidColumns=L'indice «%s» deve avere almeno una colonna e nessuna colonna ripetuta.
precheck.index.duplicate=L'indice «%s» è un doppione di «%s», che ha già le stesse colonne (%s) nello stesso ordine.
precheck.index.redundantPrefix=L'indice «%s» è superfluo: le sue colonne sono già le prime dell'indice «%s» (%s).

# --- validazione dei valori del data-entry
validate.notNull=La colonna «%s» non ammette NULL e non ha un valore predefinito.
validate.boolean=Valore non valido: scrivi 0 o 1 (oppure true / false).
validate.integer=Valore non valido: serve un numero intero.
validate.number=Valore non valido: serve un numero (con il punto come separatore decimale).
validate.range=Fuori intervallo per %s: ammessi da %s a %s.
validate.unsigned=La colonna è UNSIGNED: non ammette numeri negativi.
validate.decimal.scale=Troppe cifre decimali per %s: al massimo %s.
validate.decimal.precision=Numero troppo grande per %s: al massimo %s cifre prima della virgola.
validate.date=Data non valida: usa il formato AAAA-MM-GG, con un giorno che esiste.
validate.datetime=Data e ora non valide: usa il formato AAAA-MM-GG HH:MM:SS.
validate.time=Ora non valida: usa il formato HH:MM:SS.
validate.year=Anno non valido: quattro cifre, da 1901 a 2155.
validate.length=Testo troppo lungo: al massimo %s caratteri, qui sono %s.
validate.bytes=Testo troppo lungo: al massimo %s byte, qui sono %s.
validate.enum=Valore non ammesso. Valori possibili: %s.

# --- contatore delle modifiche pendenti
pending.insert.one=inserimento
pending.insert.many=inserimenti
pending.update.one=modifica
pending.update.many=modifiche
pending.delete.one=eliminazione
pending.delete.many=eliminazioni

# --- connessioni: diagnosi di una connessione non riuscita (ogni messaggio dice che cosa correggere)
connection.error.UNKNOWN_HOST=Il computer «%s» non si trova in rete: il nome non corrisponde a nessun indirizzo. Correggi il campo Host (controlla come è scritto) oppure usa l'indirizzo IP.
connection.error.PORT_CLOSED=Il computer «%s» risponde, ma sulla porta %s nessun server accetta connessioni. Correggi il campo Porta (di solito 3306; controlla quella indicata da chi gestisce il server) e verifica che il server MariaDB o MySQL sia avviato.
connection.error.TIMEOUT=Nessuna risposta da «%s» (porta %s) entro il tempo massimo di attesa. Controlla l'indirizzo nel campo Host, che quel computer sia acceso e raggiungibile dalla tua rete, e che un firewall non blocchi la porta.
connection.error.ACCESS_DENIED=Il server ha rifiutato l'accesso all'utente «%s»: nome utente o password sbagliati. Riscrivi la password (attenzione a maiuscole e minuscole) e controlla il campo Utente.
connection.error.CATALOG_ACCESS_DENIED=L'utente «%s» non ha il permesso di usare il catalogo «%s». Correggi il campo Catalogo del profilo (puoi lasciarlo vuoto) oppure chiedi il permesso a chi amministra il server.
connection.error.UNKNOWN_CATALOG=Il catalogo «%s» non esiste su questo server. Correggi il nome nel campo Catalogo del profilo, oppure lascialo vuoto.
connection.error.TOO_MANY_CONNECTIONS=Il server ha già raggiunto il numero massimo di connessioni. Chiudi le connessioni che non usi (anche in altri programmi) e riprova tra poco.
connection.error.HOST_NOT_ALLOWED=Il server non accetta connessioni da questo computer per l'utente «%s». Chiedi a chi amministra il server di autorizzare il tuo computer.
connection.error.SSL=Il server e il client non si accordano sulla connessione cifrata (SSL/TLS), che questa versione non permette di configurare. Chiedi a chi amministra il server di accettare connessioni non cifrate per il tuo utente.
connection.error.AUTH_PLUGIN=Il server usa per l'utente «%s» un metodo di autenticazione che il client non riesce a completare. Chiedi a chi amministra il server di usare mysql_native_password o caching_sha2_password.
connection.error.OTHER=La connessione non è riuscita. Leggi qui sotto il messaggio originale del server.
connection.error.detail.server=Errore %s (SQLSTATE %s): %s
connection.error.detail.network=Errore di rete: %s
connection.error.timeout.original=tentativo abbandonato dal client dopo %s secondi senza risposta
connection.error.deadline.original=tentativo abbandonato dal client: scaduto il tempo massimo complessivo prima del passo successivo
connection.internal.urlRejected=Indirizzo non accettato dal driver: %s
connection.internal.driverMissing=Driver JDBC non trovato: %s

# --- profili di connessione: importazione
profiles.file.invalid=Il file «%s» non è un elenco di profili di RamaSQL Client.
profiles.file.newer=Il file «%s» è stato scritto da una versione più recente di RamaSQL Client: aggiorna il programma.
profiles.file.unreadable=Il file «%s» non si può leggere (%s).

# --- impostazioni
settings.file.invalid=Il file delle impostazioni «%s» è rovinato: non è JSON valido.
settings.file.unreadable=Il file delle impostazioni «%s» non si può leggere (%s).
