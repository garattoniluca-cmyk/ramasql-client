# Testi del modulo core rivolti all'utente (italiano). Segnaposto di String.format: %s.

# --- controlli preventivi delle chiavi esterne
precheck.fk.childEngine=La tabella «%s» usa l'engine %s, che non supporta le chiavi esterne: il vincolo verrebbe ignorato. Convertila in InnoDB.
precheck.fk.parentEngine=La tabella riferita «%s» usa l'engine %s, che non supporta le chiavi esterne. Convertila in InnoDB.
precheck.fk.columnCount=Una chiave esterna deve avere lo stesso numero di colonne sui due lati (almeno una): qui sono %s e %s.
precheck.fk.columnNotFound=La colonna «%s» non esiste nella tabella «%s».
precheck.fk.type=Tipi diversi: «%s» è %s ma la colonna riferita «%s» è %s. Le due colonne devono avere lo stesso tipo.
precheck.fk.sign=Segno diverso: «%s» è %s ma la colonna riferita «%s» è %s. Devono essere entrambe UNSIGNED o entrambe con segno.
precheck.fk.collation=Charset o collation diversi: «%s» usa %s ma la colonna riferita «%s» usa %s. Per le colonne di testo devono coincidere.
precheck.fk.notIndexed=Le colonne riferite (%s) non sono le prime colonne di un indice o della chiave primaria di «%s»: crea prima l'indice.
precheck.fk.setNullNotNull=SET NULL non è possibile: la colonna «%s» è NOT NULL. Rendila annullabile o scegli un'altra azione.

# --- controlli preventivi degli indici
precheck.index.columnNotFound=La colonna «%s» non esiste nella tabella «%s».
precheck.index.invalidColumns=L'indice «%s» deve avere almeno una colonna e nessuna colonna ripetuta.
precheck.index.duplicate=L'indice «%s» è un doppione di «%s», che ha già le stesse colonne (%s) nello stesso ordine.
precheck.index.redundantPrefix=L'indice «%s» è superfluo: le sue colonne sono già le prime dell'indice «%s» (%s).

# --- validazione dei valori del data-entry
validate.notNull=La colonna «%s» non ammette NULL e non ha un valore predefinito.
validate.boolean=Valore non valido: scrivi 0 o 1 (oppure true / false).
validate.integer=Valore non valido: serve un numero intero.
validate.number=Valore non valido: serve un numero (con il punto come separatore decimale).
validate.range=Fuori intervallo per %s: ammessi da %s a %s.
validate.unsigned=La colonna è UNSIGNED: non ammette numeri negativi.
validate.decimal.scale=Troppe cifre decimali per %s: al massimo %s.
validate.decimal.precision=Numero troppo grande per %s: al massimo %s cifre prima della virgola.
validate.date=Data non valida: usa il formato AAAA-MM-GG, con un giorno che esiste.
validate.datetime=Data e ora non valide: usa il formato AAAA-MM-GG HH:MM:SS.
validate.time=Ora non valida: usa il formato HH:MM:SS.
validate.year=Anno non valido: quattro cifre, da 1901 a 2155.
validate.length=Testo troppo lungo: al massimo %s caratteri, qui sono %s.
validate.bytes=Testo troppo lungo: al massimo %s byte, qui sono %s.
validate.enum=Valore non ammesso. Valori possibili: %s.

